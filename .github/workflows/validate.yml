name: Validate Multiverse Wheel

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: spinner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Unit and content validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Run validation suite
        shell: bash
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee validation.log
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics
          path: validation.log
          if-no-files-found: error
          retention-days: 7

  chromium:
    name: Chromium release journeys
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
